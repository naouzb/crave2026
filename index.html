<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRAVE2026 | Sensory Food Discovery Platform</title>
  <meta name="description" content="Next-generation sensory food discovery & restaurant management platform featuring real-time chat, dark mode aesthetic, and multi-language support.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: '#0f0f11',
            surface: '#18181c',
            card: '#1f1f24',
            border: '#2a2a32',
            primary: {
              DEFAULT: '#ff4500',
              hover: '#ff5714',
            }
          },
          backgroundImage: {
            'neon-gradient': 'linear-gradient(135deg, #ff4500 0%, #ff0055 100%)',
          },
          boxShadow: {
            neon: '0 0 20px rgba(255, 69, 0, 0.4)',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#0f0f11] text-white font-['Plus_Jakarta_Sans'] antialiased min-h-screen">
  <div id="app"></div>
  <script src="app.js"></script>
</body>
</html>
